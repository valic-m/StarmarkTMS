{% extends 'base.html' %}

{% block title %}Add Truck{% endblock %}

{% block content %}
    <h1>Add New Truck</h1>
    <form method="POST" action="{% url 'add_truck' %}">
        {% csrf_token %}

        <!-- Truck Name -->
        <div>
            <label for="name">Enter Truck Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter Truck Name" value="{{ form.name.value|default_if_none:'' }}" required>
        </div>

        <!-- License Plate -->
        <div>
            <label for="license_plate">Enter License Plate:</label>
            <input type="text" id="license_plate" name="license_plate" placeholder="Enter License Plate" value="{{ form.license_plate.value|default_if_none:'' }}" required>
        </div>

        <!-- Manufacturer -->
        <div>
            <label for="manufacturer">Enter Manufacturer:</label>
            <input type="text" id="manufacturer" name="manufacturer" placeholder="Enter Manufacturer" value="{{ form.manufacturer.value|default_if_none:'' }}" required>
        </div>

        <!-- Year -->
        <div>
            <label for="year">Enter Year of Manufacture:</label>
            <input type="number" id="year" name="year" placeholder="Enter Year" value="{{ form.year.value|default_if_none:'' }}" required>
        </div>

        <!-- VIN -->
        <div>
            <label for="vin">Enter VIN Number:</label>
            <input type="text" id="vin" name="vin" placeholder="Enter VIN" value="{{ form.vin.value|default_if_none:'' }}" required>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Save Truck</button>
    </form>
    <a href="{% url 'trucks_list' %}">Back to Trucks List</a>
{% endblock %}
