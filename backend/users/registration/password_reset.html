{% extends 'base.html' %}

{% block title %}
Password Reset
{% endblock %}

{% block content %}
<div class="container">
    <h2>Reset Your Password</h2>
    <p>Please enter your email address below, and we will send you instructions to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
</div>
{% endblock %}
