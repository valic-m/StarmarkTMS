<!-- templates/users/active_users.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Active Users</title>
</head>
<body>
    <h1>Active Users</h1>
    <ul>
        {% for user in users %}
            <li>{{ user.username }} - {{ user.email }}</li>
        {% empty %}
            <li>No active users found</li>
        {% endfor %}
    </ul>
</body>
</html>
