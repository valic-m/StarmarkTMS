<!-- templates/users/user_activity.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity</title>
</head>
<body>
    <h1>User Activity</h1>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Activity</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for activity in activities %}
            <tr>
                <td>{{ activity.user.username }}</td>
                <td>{{ activity.action }}</td>
                <td>{{ activity.timestamp }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No user activity available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
