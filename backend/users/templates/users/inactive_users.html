<!-- templates/users/inactive_users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inactive Users</title>
</head>
<body>
    <h1>Inactive Users</h1>

    <ul>
        {% for user in users %}
        <li>{{ user.username }} - {{ user.email }}</li>
        {% empty %}
        <li>No inactive users found.</li>
        {% endfor %}
    </ul>
</body>
</html>
