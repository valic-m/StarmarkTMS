<!-- templates/users/user_commission.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Commission</title>
</head>
<body>
    <h1>User Commission</h1>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Commission Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for user, commission in user_commissions.items %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ commission }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No commission data available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
