{% extends 'base.html' %}

{% block title %}Add/Edit Carrier{% endblock %}

{% block content %}
<h2>{{ form.instance.id|yesno:"Edit Carrier,Add Carrier" }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Carrier</button>
</form>

<a href="{% url 'carrier_list' %}" class="btn btn-secondary mt-3">Cancel</a>
{% endblock %}
