{% extends 'base.html' %}

{% block title %}Create or Edit Dispatch{% endblock %}

{% block content %}
<div class="container">
    <h2>{% if dispatch %}Edit Dispatch{% else %}Create Dispatch{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Dispatch</button>
    </form>
</div>
{% endblock %}
