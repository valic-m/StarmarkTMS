{% extends 'base.html' %}

{% block title %}Dispatch Load{% endblock %}

{% block content %}
<div class="container">
    <h2>Dispatch Load</h2>

    {% if load and drivers %}
    <p>Load from {{ load.origin }} to {{ load.destination }}</p>

    <form method="POST">
        {% csrf_token %}

        <label for="driver">Select Driver</label>
        <select name="driver" class="form-control" id="driver">
            {% for driver in drivers %}
            <option value="{{ driver.id }}">{{ driver.full_name }}</option>
            {% endfor %}
        </select>

        <label for="truck" class="mt-3">Select Truck</label>
        <select name="truck" class="form-control" id="truck">
            {% for truck in trucks %}
            <option value="{{ truck.id }}">{{ truck.name }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-primary mt-3">Dispatch Load</button>
    </form>

    {% else %}
    <p>No load or drivers available to dispatch.</p>
    {% endif %}
</div>
{% endblock %}
