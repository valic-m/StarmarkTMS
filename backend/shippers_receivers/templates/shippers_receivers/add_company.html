<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Shipper-Receiver</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Make the modal container responsive */
        .modal-container {
            width: 90%;
            max-width: 800px;
            background-color: #f8f9fa;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin: 40px auto;
            padding: 0;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-footer {
            padding: 15px;
            text-align: right;
        }
        /* Custom styles for tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #0056b3;
            width: 100%;
        }
        .nav-tabs .nav-item {
            flex: 1;
            text-align: center;
        }
        .nav-tabs .nav-link {
            width: 100%;
            border: none;
            color: #0056b3;
            padding: 10px 0;
        }
        .nav-tabs .nav-link.active {
            background-color: #0056b3;
            color: #fff;
        }
        .tab-content {
            padding: 20px;
        }
        /* CSS for Star Rating */
        .star-rating {
            font-size: 24px;
            color: #d3d3d3;
            cursor: pointer;
        }
        .star-rating .star:hover,
        .star-rating .star.selected {
            color: #f39c12;
        }
    </style>
</head>
<body>

<div class="modal-container">
    <div class="modal-body">
        <form method="post">
            {% csrf_token %}

            <!-- Tab Navigation -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="basic-info-tab" data-toggle="tab" href="#basic-info" role="tab" aria-controls="basic-info" aria-selected="true">Basic Info</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="company-info-tab" data-toggle="tab" href="#company-info" role="tab" aria-controls="company-info" aria-selected="false">Company Info</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="additional-info-tab" data-toggle="tab" href="#additional-info" role="tab" aria-controls="additional-info" aria-selected="false">Additional Info</a>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content mt-3" id="myTabContent">
                <!-- Basic Info Section -->
                <div class="tab-pane fade show active" id="basic-info" role="tabpanel" aria-labelledby="basic-info-tab">
                    <div class="form-group mb-3">
                        <label for="company_name">Company Name</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="address">Address</label>
                        <input type="text" class="form-control" id="address" name="address">
                    </div>
                    <div class="form-group mb-3">
                        <label for="contact_person">Contact Person</label>
                        <input type="text" class="form-control" id="contact_person" name="contact_person">
                    </div>
                    <div class="form-group mb-3">
                        <label for="phone_number">Phone Number</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number">
                    </div>
                    <div class="form-group mb-3">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                </div>

                <!-- Company Info Section -->
                <div class="tab-pane fade" id="company-info" role="tabpanel" aria-labelledby="company-info-tab">
                    <div class="form-group mb-3">
                        <label for="shipping_hours">Shipping Hours</label>
                        <input type="text" class="form-control" id="shipping_hours" name="shipping_hours" placeholder="e.g., 9 AM - 6 PM">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shipping_manager_name">Shipping Manager Name</label>
                        <input type="text" class="form-control" id="shipping_manager_name" name="shipping_manager_name">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shipping_manager_phone">Shipping Manager Phone</label>
                        <input type="text" class="form-control" id="shipping_manager_phone" name="shipping_manager_phone">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shipping_manager_email">Shipping Manager Email</label>
                        <input type="email" class="form-control" id="shipping_manager_email" name="shipping_manager_email">
                    </div>
                </div>

                <!-- Additional Info Section -->
                <div class="tab-pane fade" id="additional-info" role="tabpanel" aria-labelledby="additional-info-tab">
                    <div class="form-group mb-3">
                        <label for="rating">Rating</label>
                        <div class="star-rating" id="starRating">
                            <span class="star" data-value="1">&#9733;</span>
                            <span class="star" data-value="2">&#9733;</span>
                            <span class="star" data-value="3">&#9733;</span>
                            <span class="star" data-value="4">&#9733;</span>
                            <span class="star" data-value="5">&#9733;</span>
                        </div>
                        <input type="hidden" id="rating" name="rating" value="3">
                    </div>
                    <div class="form-group mb-3">
                        <label for="load_time">Load Time</label>
                        <input type="text" class="form-control" id="load_time" name="load_time" placeholder="e.g., 2 hours">
                    </div>
                    <div class="form-group mb-3">
                        <label for="comments">Comments</label>
                        <textarea class="form-control" id="comments" name="comments"></textarea>
                    </div>
                    <div class="form-group mb-3">
                        <label for="directions">Directions</label>
                        <textarea class="form-control" id="directions" name="directions"></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="do_not_load" name="do_not_load">
                        <label class="form-check-label" for="do_not_load">Do Not Load</label>
                    </div>
                </div>
            </div>

            <!-- Action Buttons Section -->
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Include jQuery and Bootstrap JS for tab functionality -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- JavaScript for Star Rating -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stars = document.querySelectorAll('.star-rating .star');
        const ratingInput = document.getElementById('rating');

        stars.forEach(star => {
            star.addEventListener('mouseover', function() {
                resetStars();
                this.classList.add('selected');
                let previousStar = this.previousElementSibling;
                while (previousStar) {
                    previousStar.classList.add('selected');
                    previousStar = previousStar.previousElementSibling;
                }
            });

            star.addEventListener('mouseout', resetStars);

            star.addEventListener('click', function() {
                ratingInput.value = this.getAttribute('data-value');
            });
        });

        function resetStars() {
            stars.forEach(star => {
                star.classList.remove('selected');
            });
            const currentRating = parseInt(ratingInput.value);
            for (let i = 0; i < currentRating; i++) {
                stars[i].classList.add('selected');
            }
        }

        resetStars();
    });
</script>

</body>
</html>
