{% extends "base.html" %}

{% block title %}Company List{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>List of Companies</h2>
    
    <ul class="company-list">
        {% for company in companies %}
            <li>
                <a href="{% url 'company_detail' company.id %}">{{ company.name }}</a> - {{ company.industry }}
            </li>
        {% empty %}
            <li>No companies available.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'create_company' %}" class="btn btn-primary">Add Company</a>
</div>
{% endblock %}
