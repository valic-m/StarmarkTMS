{% extends 'base.html' %}

{% block title %}Add/Edit Company{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{{ form.instance.id|yesno:"Edit Company,Add New Company" }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Company</button>
    </form>
    <a href="{% url 'company_list' %}" class="btn btn-secondary">Cancel</a>
</div>
{% endblock %}
